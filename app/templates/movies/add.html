{% extends 'base.html' %}

{% block header %}
  <h1>Add Movie</h1>
{% endblock %}

{% block content %}
  <form method="post">
    <label for="title">Title</label>
    <input id="title" name="title" value="{{ title or '' }}" required>

    <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
    <button type="submit">Add Movie</button>
  </form>
{% endblock %}
